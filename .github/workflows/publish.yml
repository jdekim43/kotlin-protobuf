name: Publish to Maven Central

on:
  push:
    branches:
      - main
    paths:
      - gradle.properties
  workflow_dispatch:

# Read by default; only the deploy job, which tags the commit and creates the GitHub release through
# JReleaser, is granted write.
permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

env:
  GRADLE_ARGS: --no-daemon --stacktrace

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          extract_release_version() {
            sed -n 's/^releaseVersion=[[:space:]]*//p' | tail -n 1
          }

          release_version="$(extract_release_version < gradle.properties)"
          if [[ -z "$release_version" ]]; then
            echo "releaseVersion is not declared in gradle.properties." >&2
            exit 1
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Expected a semantic version such as 1.0.0 or 1.0.0-beta1, got: $release_version" >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

          # A manual dispatch is itself the intent to release, so skip the comparison.
          # github.event.before only exists on push events; elsewhere PREVIOUS_SHA is
          # empty and "git show :<path>" reads the index, making the version always
          # look unchanged and silently skipping the release.
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "Triggered by $GITHUB_EVENT_NAME; releasing $release_version without comparing against the previous commit."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(
            { git show "$PREVIOUS_SHA:gradle.properties" 2>/dev/null || true; } | extract_release_version
          )"

          if [[ "$release_version" == "$previous_version" ]]; then
            echo "releaseVersion is unchanged at $release_version; skipping the release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releaseVersion changed from ${previous_version:-<none>} to $release_version."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release secrets
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail

          for secret_name in \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_PASSWORD \
            GPG_PUBLIC_KEY \
            GPG_SECRET_KEY \
            GPG_PASSPHRASE \
            GRADLE_PUBLISH_KEY \
            GRADLE_PUBLISH_SECRET
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "$secret_name secret is required." >&2
              exit 1
            fi
          done

  build:
    name: Build and stage publications
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 8 because convention.kotlin-jvm and convention.kotlin-multiplatform both declare jvmToolchain(8),
      # replacing the 11 that no module asks for. The runner image happens to preinstall a JDK 8 today, but
      # the images drop old JDKs as they age, so the toolchain the build actually compiles against is
      # requested here rather than assumed. setup-java records every version it installs in
      # ~/.m2/toolchains.xml, which Gradle reads when resolving a toolchain; the last entry also becomes
      # JAVA_HOME, so Gradle itself keeps running on 21.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: Cache Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/kotlin.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Stage Maven publications
        run: ./gradlew publish $GRADLE_ARGS

      - name: Upload staged publications
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy
          # ** rather than *: the generator modules are nested (generator/converter/jvm and friends),
          # so a single level would silently drop them from the release.
          path: "**/build/staging-deploy"
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: jvm
            os: ubuntu-24.04
            tasks: jvmTest
          - name: gradle-plugin
            os: ubuntu-24.04
            tasks: "checkGradlePlugin"
          # No js/native rows: convention.kotlin-multiplatform currently enables only jvm(), so those
          # test tasks do not exist and fail-fast would kill the release. Add them back in the same
          # commit that enables the targets.

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: Cache Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/kotlin.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run ${{ matrix.name }} tests
        run: ./gradlew ${{ matrix.tasks }} $GRADLE_ARGS

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            **/build/reports/tests
            **/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy ${{ needs.prepare.outputs.release_version }}
    needs:
      - prepare
      - build
      - test
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity for the release tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download staged publications
        uses: actions/download-artifact@v4
        with:
          name: staging-deploy

      - name: Verify staged publications
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          # build/staging-deploy first: the root project publishes an artifact of its own, and JReleaser
          # lists that directory as a staging repository, so leaving it out would verify everything except
          # the aggregate module.
          staging_directories=(
            build/staging-deploy
            */build/staging-deploy
            */*/build/staging-deploy
            */*/*/build/staging-deploy
          )

          if (( ${#staging_directories[@]} == 0 )); then
            echo "The build job produced no staging repository." >&2
            exit 1
          fi

          for staging_directory in "${staging_directories[@]}"
          do
            pom_count="$(find "$staging_directory" -name '*.pom' | wc -l | tr -d '[:space:]')"
            if (( pom_count == 0 )); then
              echo "No staged artifacts found in $staging_directory" >&2
              exit 1
            fi
            echo "$staging_directory: $pom_count POM(s)"
          done

      - name: Prepare signing keys
        id: signing
        shell: bash
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: |
          set -euo pipefail

          key_directory="$RUNNER_TEMP/jreleaser-keys"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          umask 077
          printf '%s\n' "$GPG_PUBLIC_KEY" > "$key_directory/public.asc"
          printf '%s\n' "$GPG_SECRET_KEY" > "$key_directory/secret.asc"

          echo "public_key=$key_directory/public.asc" >> "$GITHUB_OUTPUT"
          echo "secret_key=$key_directory/secret.asc" >> "$GITHUB_OUTPUT"

      - name: Publish, tag and create GitHub release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_RELEASE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_RELEASE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ steps.signing.outputs.public_key }}
          JRELEASER_GPG_SECRET_KEY: ${{ steps.signing.outputs.secret_key }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew jreleaserFullRelease $GRADLE_ARGS

      - name: Remove signing keys
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jreleaser-keys/public.asc" "$RUNNER_TEMP/jreleaser-keys/secret.asc"

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
          if-no-files-found: ignore
          retention-days: 7

  publish-plugin-portal:
    name: Publish the Gradle plugin to the Plugin Portal
    needs:
      - prepare
      - deploy
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Runs after deploy, never before: a Plugin Portal version cannot be deleted, so publishing it
      # first would leave a listing pointing at artifacts that never reached Maven Central.
      - name: Publish the plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p gradle-plugin publishPlugins $GRADLE_ARGS
